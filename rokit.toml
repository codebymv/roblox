# Pinned toolchain. Run `rokit install` once after cloning and every tool below
# lands on PATH at exactly the version CI uses.
#
# Install rokit itself from https://github.com/rojo-rbx/rokit.
#
# Versions are pinned rather than floating on purpose: a formatter that changes
# its defaults between contributors produces diffs nobody wrote.

[tools]
rojo = "rojo-rbx/rojo@7.7.0"
stylua = "JohnnyMorganz/StyLua@2.4.0"
selene = "Kampfkarren/selene@0.30.1"
luau-lsp = "JohnnyMorganz/luau-lsp@1.67.0"
lune = "lune-org/lune@0.10.4"
